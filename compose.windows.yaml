# Back-compat alias. The real stack lives in the canonical, cross-platform
# compose.yaml; this file only re-exports it so existing Windows scripts
# (scripts/windows/*.ps1) keep working unchanged. Prefer compose.yaml directly:
#   docker compose up -d
#   docker compose --profile console up -d console
# `include` requires Docker Compose v2.20+ (Docker Desktop 4.22+); any recent
# Docker Desktop on Windows meets this.
include:
  - compose.yaml
