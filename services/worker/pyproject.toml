[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "facetrack-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["facetrack-ml", "celery[redis]>=5.5,<6", "httpx>=0.28,<1", "python-dotenv>=1,<2", "pandas>=2.2,<4", "openpyxl>=3.1,<4", "reportlab>=4.2,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv.sources]
facetrack-ml = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/facetrack_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
constraint-dependencies = ["numpy==2.4.6", "opencv-python-headless==4.14.0.94", "onnxruntime==1.31.0", "cryptography==47.0.0", "pydantic==2.14.1", "imageio-ffmpeg==0.6.0"]
