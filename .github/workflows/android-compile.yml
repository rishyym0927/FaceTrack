name: Android compile check

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to compile without signing or distribution
        required: true
        default: student
        type: choice
        options: [student, teacher]

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Compile debug APK (no client distribution)
        working-directory: apps/${{ inputs.app }}
        run: |
          ../../scripts/flutter pub get --enforce-lockfile
          ../../scripts/flutter build apk --debug --target-platform android-arm64
